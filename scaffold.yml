version: 2

project:
  contracts-dir: contracts
  clients-dir: app-lib/clients

networks:
  testnet:
    accounts: [me]
    default-account: me
    allow-deploy: true
  staging:
    extends: testnet
    accounts: [testnet-user]
    default-account: testnet-user
    allow-deploy: true

contracts:
  reputation:
    type: workspace
    source: reputation
    networks:
      testnet:
      staging:
  pools:
    type: workspace
    source: pools
    args:
      admin: ${account.me}
    networks:
      testnet:
      staging:
        args:
          admin: ${account.testnet-user}
  fondos:
    type: workspace
    source: fondos
    args:
      admin: ${account.me}
      usdc: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
    networks:
      testnet:
      staging:
        args:
          admin: ${account.testnet-user}
          usdc: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
